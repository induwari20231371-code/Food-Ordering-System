# ===================================
# Application Configuration
# ===================================
spring.application.name=food-ordering-system
server.port=8080

# ===================================
# MySQL Database Configuration
# ===================================
# Default datasource: H2 in-memory for local development
spring.datasource.url=jdbc:h2:mem:fooddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# If you want to use MySQL instead, uncomment and update the lines below and
# ensure a MySQL server is running and reachable at the configured host/port.
#spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=Puleesha_i
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate Configuration
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
## Hibernate dialect will be chosen automatically; keep default for H2.
# If using MySQL, you can set: spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================================
# JWT Configuration
# ===================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# ===================================
# Logging Configuration
# ===================================
logging.level.com.foodorder=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/food-ordering.log